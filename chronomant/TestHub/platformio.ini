; PlatformIO Project Configuration File
;
; Quest Hub — на базе боевого кода (192.168.8.177), + rssi, + вкладка Chronomant.
; ESP32-S3, PicoMQTT брокер + веб-морда с вкладками/power-device/NVS-настройками.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    mlesniew/PicoMQTT
