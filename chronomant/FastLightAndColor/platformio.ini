; PlatformIO Project Configuration File
;
; Т-образная лента — квест "Огонь чернокнижника".
; ESP32-C3 SuperMini, 2 ленты WS2812B (горизонталь 60 + вертикаль 40),
; 2 кнопки, MQTT (Quest Hub).
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    knolleary/PubSubClient@^2.8

; Заливка по воздуху:  pio run -e ota -t upload
[env:ota]
extends = env:airm2m_core_esp32c3
upload_protocol = espota
upload_port = chrono-strip.local
upload_flags =
    --port=3232
    --auth=chrono
