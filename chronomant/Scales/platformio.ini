; PlatformIO Project Configuration File
;
; Весы (HX711) — хрономаг, задание "Весы + лампочки"

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5

; Заливка по воздуху:  pio run -e ota -t upload
; IP смотреть в Serial при первой заливке по USB: "[WIFI] подключено, IP ..."
[env:ota]
extends = env:airm2m_core_esp32c3
upload_protocol = espota
upload_port = chrono-scales.local
upload_flags =
    --port=3232
    --auth=chrono
